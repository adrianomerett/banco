<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado 2 — Engenharia de Software</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#2563eb;--ok:#15803d;--bad:#b91c1c;--border:#dbe2ea}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}.container{max-width:920px;margin:auto;padding:24px 15px 45px}header,.card,.result{background:var(--card);border:1px solid var(--border);border-radius:17px;box-shadow:0 6px 24px #1018280c}header{padding:22px;margin-bottom:18px}h1{margin:0 0 5px;font-size:clamp(23px,4vw,30px)}.sub{color:var(--muted);margin:0}.top{display:flex;justify-content:space-between;gap:8px;margin:18px 0 8px;font-weight:700}.progress{height:9px;background:#e8edf3;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--primary);width:0;transition:width .2s}.card{padding:clamp(17px,4vw,26px);display:none}.card.active{display:block}.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;margin-bottom:10px}h2{font-size:20px;line-height:1.4;margin:0 0 18px}.options{display:grid;gap:10px}.option{border:1px solid var(--border);border-radius:11px;padding:12px 13px;cursor:pointer;background:#fff}.option:hover{border-color:#93c5fd}.option.selected{border-color:var(--primary);background:#eff6ff}.option.correct{border-color:var(--ok);background:#ecfdf3}.option.wrong{border-color:var(--bad);background:#fef2f2}.option input{margin-right:8px}.feedback{display:none;margin-top:16px;padding:13px;border-radius:11px}.feedback.show{display:block}.feedback.ok{background:#ecfdf3;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:19px}button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.check{background:var(--primary);color:white}.next{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.result{display:none;padding:24px}.result.show{display:block}.score{font-size:44px;font-weight:800;margin:4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.stat{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.topic{margin:10px 0}.topichead{display:flex;justify-content:space-between;font-size:14px}.mini{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:4px}.mini div{height:100%;background:var(--primary)}.hint{font-size:13px;color:var(--muted)}.nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}.nav button{padding:7px 9px;font-size:12px;background:#e5e7eb}.nav button.done{background:#dcfce7;color:#166534}.nav button.current{outline:2px solid var(--primary)}@media(max-width:600px){.actions{flex-direction:column}.actions button{width:100%}.stats{grid-template-columns:1fr}.top{font-size:14px}}
</style></head><body><main class="container"><header><h1>Simulado 2 — Engenharia de Software</h1><p class="sub">30 questões do arquivo SIMULADO 2.pdf • correção imediata • nota final e desempenho por tema</p><div class="top"><span id="progressText">Questão 1 de 30</span><span id="scoreText">Acertos: 0</span></div><div class="progress"><div id="progressBar"></div></div><div class="nav" id="nav"></div></header><div id="quiz"></div><section id="result" class="result"></section></main>
<script>
const questions=[{"topic": "Fundamentos de Engenharia de Software", "q": "Uma instituição financeira implantou um sistema que executa operações bancárias com rapidez, mas apresenta inconsistências no cálculo de juros e dificuldades de manutenção. Embora o código seja executado sem interrupções, os resultados comprometem a confiabilidade das operações. Considerando os fundamentos da Engenharia de Software, assinale a alternativa correta.", "a": ["A ausência de falhas de execução comprova a qualidade do software, independentemente dos resultados apresentados.", "A qualidade de software depende exclusivamente da linguagem de programação e da infraestrutura utilizada.", "A Engenharia de Software concentra-se na implementação, enquanto a confiabilidade é responsabilidade exclusiva dos usuários.", "A Engenharia de Software emprega princípios, métodos e práticas sistemáticas para desenvolver e manter sistemas que atendam aos requisitos e atributos de qualidade esperados.", "Um software que apresenta desempenho satisfatório dispensa processos de validação e manutenção."], "c": 3, "e": "A alternativa correta é D: A Engenharia de Software emprega princípios, métodos e práticas sistemáticas para desenvolver e manter sistemas que atendam aos requisitos e atributos de qualidade esperados."}, {"topic": "Crise do Software", "q": "Uma empresa decidiu desenvolver um aplicativo de entregas sem realizar levantamento de requisitos, planejamento ou análise das necessidades dos usuários. Após seis meses, verificou que diversas funcionalidades implementadas não correspondiam às expectativas dos clientes, exigindo retrabalho significativo. Esse cenário evidencia um problema historica- mente associado à chamada Crise do Software. A respeito desse fenômeno, assinale a alternativa correta.", "a": ["A Crise do Software decorreu exclusivamente da incapacidade dos computadores de executar programas complexos.", "A Crise do Software evidenciou dificuldades recorrentes relacionadas a custos, prazos, qualidade e complexidade dos sistemas, contribuindo para a consolidação da Engenharia de Software.", "A Crise do Software foi solucionada definitivamente com o surgimento das linguagens orientadas a objetos.", "A principal consequência da Crise do Software foi a eliminação da necessidade de documentação técnica.", "A Crise do Software demonstrou que a programação individual é necessariamente superior ao desenvolvimento organizado em equipes."], "c": 1, "e": "A alternativa correta é B: A Crise do Software evidenciou dificuldades recorrentes relacionadas a custos, prazos, qualidade e complexidade dos sistemas, contribuindo para a consolidação da Engenharia de Software."}, {"topic": "Processo de Software", "q": "Durante o desenvolvimento de um sistema hospita- lar, uma equipe identificou a necessidade de com- preender os processos clínicos, planejar recursos, representar a solução, implementar funcionalidades e disponibilizar o produto aos profissionais de saúde. Considerando as atividades genéricas de um pro- cesso de software, a sequência que melhor repre- senta essa organização é:", "a": ["Construção, entrega, planejamento, comunicação e modelagem.", "Planejamento, implementação, manutenção, comunicação e entrega.", "Comunicação, planejamento, modelagem, construção e entrega.", "Modelagem, entrega, construção, comunicação e planejamento.", "Comunicação, construção, entrega, planejamento e modelagem."], "c": 2, "e": "A alternativa correta é C: Comunicação, planejamento, modelagem, construção e entrega."}, {"topic": "Hardware e Software", "q": "Um sistema de controle industrial é composto por programas que processam informações de senso- res, dispositivos físicos responsáveis pela medição e mecanismos de comunicação com operadores. Ao analisar a relação entre hardware e software, é correto afirmar que:", "a": ["O hardware corresponde aos componentes físicos, enquanto o software compreende programas e elementos associados que orientam o processamento e o funcionamento do sistema.", "O software representa exclusivamente os dispositivos de armazenamento utilizados pelo computador.", "O hardware é responsável pelas regras de negócio, enquanto o software executa somente funções elétricas.", "Hardware e software são elementos independentes, cuja integração não interfere no funcionamento do sistema.", "Sistemas embarcados dispensam software porque executam operações diretamente em componentes eletrônicos."], "c": 0, "e": "A alternativa correta é A: O hardware corresponde aos componentes físicos, enquanto o software compreende programas e elementos associados que orientam o processamento e o funcionamento do sistema."}, {"topic": "Qualidade de Software", "q": "Uma organização desenvolveu um sistema de aten- dimento ao público. Após a implantação, verificou que todas as funcionalidades previstas estavam disponíveis, mas os usuários enfrentavam dificulda- des para localizar informações, concluir solicitações e compreender mensagens apresentadas pela in- terface. Nesse contexto, conclui-se corretamente que:", "a": ["O atendimento aos requisitos funcionais elimina a necessidade de avaliar a experiência dos usuários.", "A existência de todas as funcionalidades comprova que o sistema possui qualidade satisfatória.", "Problemas de usabilidade somente podem ser corrigidos mediante substituição integral da arquitetura.", "A satisfação dos usuários não integra os objetivos da Engenharia de Software.", "O sistema pode atender aos requisitos funcionais e ainda apresentar deficiências em atributos de qualidade, como usabilidade."], "c": 4, "e": "A alternativa correta é E: O sistema pode atender aos requisitos funcionais e ainda apresentar deficiências em atributos de qualidade, como usabilidade."}, {"topic": "Projeto e Operação", "q": "Uma empresa foi contratada para desenvolver um sistema de gestão escolar. O trabalho possui objeti- vos específicos, orçamento limitado, equipe defi- nida e previsão de encerramento após a entrega e aceitação do produto. Posteriormente, a instituição continuará utilizando o sistema em suas atividades administrativas. Considerando a distinção entre projeto e operação, assinale a alternativa correta.", "a": ["O desenvolvimento e a utilização cotidiana são projetos temporários, pois ambos dependem de tecnologia.", "A utilização do sistema constitui projeto, enquanto seu desenvolvimento representa operação permanente.", "O desenvolvimento é uma operação porque envolve atividades repetitivas de programação.", "O desenvolvimento caracteriza um projeto temporário, enquanto a utilização contínua do sistema integra as operações da instituição.", "A distinção entre projeto e operação depende exclusivamente da quantidade de profissionais envolvidos."], "c": 3, "e": "A alternativa correta é D: O desenvolvimento caracteriza um projeto temporário, enquanto a utilização contínua do sistema integra as operações da instituição."}, {"topic": "Gerenciamento de Projetos", "q": "Durante o desenvolvimento de um sistema corpora- tivo, o cliente solicitou funcionalidades adicionais que não estavam previstas no planejamento inicial. A equipe identificou que a solicitação poderia au- mentar o prazo, os custos e a necessidade de pro- fissionais especializados. A decisão mais adequada sob a perspectiva do ge- renciamento de projetos é:", "a": ["Incorporar imediatamente todas as funcionalidades, sem revisar o planejamento.", "Avaliar os impactos da mudança sobre escopo, cronograma, custos, recursos e riscos antes de decidir sua implementação.", "Rejeitar automaticamente qualquer solicitação posterior à aprovação inicial do projeto.", "Manter o cronograma original, independentemente da quantidade de funcionalidades acrescentadas.", "Transferir integralmente a responsabilidade pela mudança aos desenvolvedores."], "c": 1, "e": "A alternativa correta é B: Avaliar os impactos da mudança sobre escopo, cronograma, custos, recursos e riscos antes de decidir sua implementação."}, {"topic": "Gerenciamento de Riscos", "q": "Uma equipe responsável por um sistema de paga- mentos identificou dois riscos: indisponibilidade temporária do ambiente de testes e possível com- prometimento de dados financeiros por falhas de segurança. O gerente do projeto precisa priorizar medidas pre- ventivas considerando a exposição aos riscos. Assinale a alternativa que apresenta o procedi- mento mais adequado.", "a": ["Priorizar sempre o risco que foi identificado primeiro, independentemente de sua gravidade.", "Considerar exclusivamente a probabilidade de ocorrência, desconsiderando suas consequências.", "Avaliar a probabilidade e o impacto de cada risco, definindo estratégias proporcionais à exposição identificada.", "Eliminar todos os riscos antes de iniciar o desenvolvimento, garantindo que não ocorram eventos inesperados.", "Adiar a análise dos riscos até que algum problema efetivamente aconteça."], "c": 2, "e": "A alternativa correta é C: Avaliar a probabilidade e o impacto de cada risco, definindo estratégias proporcionais à exposição identificada."}, {"topic": "Cronograma de Projeto", "q": "Uma equipe acompanha o desenvolvimento de um aplicativo por meio de um cronograma. Durante uma reunião, verificou-se que determinadas tarefas estavam atrasadas e dependiam da conclusão de outras atividades. Para analisar adequadamente o impacto desses atrasos, é necessário considerar:", "a": ["As dependências entre atividades e seus efeitos sobre os marcos e prazos do projeto.", "Exclusivamente a quantidade de linhas de código produzidas por cada desenvolvedor.", "Apenas o número de reuniões realizadas pela equipe durante a semana.", "A eliminação das tarefas de testes para recuperar automaticamente o prazo.", "Somente o custo individual das ferramentas utilizadas pelos programadores."], "c": 0, "e": "A alternativa correta é A: As dependências entre atividades e seus efeitos sobre os marcos e prazos do projeto."}, {"topic": "Sucesso do Projeto", "q": "Uma organização concluiu o desenvolvimento de um sistema dentro do orçamento e do prazo inicial- mente estabelecidos. Entretanto, os usuários rejei- taram o produto porque funcionalidades essenciais não atendiam às necessidades operacionais. Com base nos princípios de gerenciamento de pro- jetos de software, é correto afirmar que:", "a": ["O projeto foi plenamente bem-sucedido, pois cumpriu as restrições de tempo e custo.", "A aceitação do usuário não deve ser considerada na avaliação dos resultados do projeto.", "O atendimento ao cronograma é suficiente para comprovar a qualidade do produto.", "O sucesso do projeto depende exclusivamente da produtividade da equipe técnica.", "O cumprimento de prazo e orçamento não garante, isoladamente, a entrega de um produto adequado aos requisitos e às necessidades das partes interessadas."], "c": 4, "e": "A alternativa correta é E: O cumprimento de prazo e orçamento não garante, isoladamente, a entrega de um produto adequado aos requisitos e às necessidades das partes interessadas."}, {"topic": "Engenharia de Requisitos", "q": "Durante o levantamento de necessidades de uma universidade, um gestor afirmou: \"Precisamos me- lhorar o processo de matrícula dos estudantes\". Após entrevistas e análise dos procedimentos insti- tucionais, a equipe especificou: \"O sistema deverá permitir que estudantes autenticados solicitem ma- trícula em disciplinas com vagas disponíveis\". Considerando a Engenharia de Requisitos, assinale a alternativa correta.", "a": ["A primeira afirmação representa um requisito funcional completo e diretamente verificável.", "A segunda afirmação corresponde exclusivamente a uma decisão de arquitetura.", "As duas afirmações apresentam o mesmo grau de precisão e verificabilidade.", "A primeira expressa uma necessidade geral, enquanto a segunda representa uma especificação funcional mais concreta e passível de verificação.", "A segunda afirmação é um requisito não funcional porque envolve autenticação."], "c": 3, "e": "A alternativa correta é D: A primeira expressa uma necessidade geral, enquanto a segunda representa uma especificação funcional mais concreta e passível de verificação."}, {"topic": "Classificação de Requisitos", "q": "Considere os seguintes requisitos de um sistema de comércio eletrônico: I. O sistema deverá permitir que o cliente acompa- nhe o status de seus pedidos. II. O sistema deverá responder às consultas de pro- dutos em até dois segundos, sob uma carga opera- cional especificada. III. Compras acima de R$ 300,00 terão direito a frete gratuito. A classificação mais adequada para I, II e III, res- pectivamente, é:", "a": ["Não funcional, funcional e requisito de interface.", "Funcional, não funcional e regra de negócio.", "Regra de negócio, funcional e não funcional.", "Funcional, regra de negócio e requisito de arquitetura.", "Não funcional, regra de negócio e funcional."], "c": 1, "e": "A alternativa correta é B: Funcional, não funcional e regra de negócio."}, {"topic": "Requisitos Não Funcionais", "q": "Uma equipe recebeu o seguinte requisito: \"O sistema deverá ser rápido, seguro e fácil de utili- zar\". Durante a validação, os analistas identificaram difi- culdades para estabelecer critérios objetivos de aceitação. A principal deficiência dessa especificação é:", "a": ["A utilização de atributos de qualidade, que não devem constar em documentos de requisitos.", "A ausência de indicação da linguagem de programação que será utilizada.", "A falta de critérios mensuráveis ou verificáveis para os atributos apresentados.", "A inexistência de um diagrama de classes associado ao requisito.", "A impossibilidade de testar requisitos não funcionais."], "c": 2, "e": "A alternativa correta é C: A falta de critérios mensuráveis ou verificáveis para os atributos apresentados."}, {"topic": "UML — Casos de Uso", "q": "Durante a análise de um sistema hospitalar, foram identificados os seguintes atores e funcionalidades: - Paciente: solicitar agendamento. - Recepcionista: confirmar agendamento. - Médico: consultar histórico clínico. A equipe decidiu representar as interações entre os usuários externos e as funcionalidades oferecidas pelo sistema. O artefato de modelagem mais adequado para essa finalidade é:", "a": ["Diagrama de casos de uso.", "Diagrama de implantação.", "Modelo físico de banco de dados.", "Diagrama de componentes.", "Diagrama de distribuição de rede."], "c": 0, "e": "A alternativa correta é A: Diagrama de casos de uso."}, {"topic": "Gerenciamento de Requisitos", "q": "Durante a construção de um sistema acadêmico, o setor financeiro solicitou uma alteração nas regras de cobrança. A equipe identificou que essa modifi- cação afetaria funcionalidades, testes e documen- tação previamente aprovados. Considerando a gestão de requisitos, a conduta mais adequada consiste em:", "a": ["Alterar diretamente o código e ignorar os demais artefatos do projeto.", "Descartar toda a documentação existente e reiniciar obrigatoriamente o desenvolvimento.", "Impedir qualquer mudança após a primeira versão dos requisitos.", "Transferir a responsabilidade pela alteração exclusivamente ao setor financeiro.", "Analisar o impacto da mudança, atualizar os requisitos e manter a rastreabilidade entre os artefatos afetados."], "c": 4, "e": "A alternativa correta é E: Analisar o impacto da mudança, atualizar os requisitos e manter a rastreabilidade entre os artefatos afetados."}, {"topic": "Projeto de Software", "q": "Uma equipe concluiu a análise dos requisitos de um sistema de biblioteca e iniciou a definição de seus componentes, interfaces, estruturas de dados e mecanismos de comunicação. Embora ainda não tenha produzido o código defini- tivo, a equipe está tomando decisões fundamentais para a construção da solução. Essa atividade corresponde predominantemente à etapa de:", "a": ["Manutenção corretiva.", "Projeto de software.", "Testes de aceitação.", "Implantação operacional.", "Levantamento inicial de necessidades."], "c": 1, "e": "A alternativa correta é B: Projeto de software."}, {"topic": "Modularidade", "q": "Uma aplicação corporativa possui um único módulo responsável por autenticação, processamento fi- nanceiro, emissão de relatórios e comunicação com serviços externos. Qualquer alteração exige modifi- car diversas partes do mesmo código, aumentando o risco de defeitos. Para melhorar a estrutura do sistema, a equipe pre- tende reorganizar suas responsabilidades. A alternativa mais adequada é:", "a": ["Concentrar ainda mais funcionalidades no mesmo módulo para reduzir o número de arquivos.", "Eliminar as interfaces entre componentes e permitir acesso irrestrito aos dados internos.", "Aumentar as dependências entre os módulos para facilitar a comunicação.", "Separar responsabilidades em componentes coesos, buscando reduzir o acoplamento desnecessário.", "Substituir a documentação por comentários extensos, mantendo a arquitetura original."], "c": 3, "e": "A alternativa correta é D: Separar responsabilidades em componentes coesos, buscando reduzir o acoplamento desnecessário."}, {"topic": "Abstração", "q": "No projeto de um sistema de gestão hospitalar, a equipe decidiu inicialmente representar os princi- pais subsistemas e suas interações. Posterior- mente, detalhou as classes, interfaces e estruturas internas de cada componente. Essa estratégia demonstra a aplicação do princípio de:", "a": ["Abstração, permitindo representar inicialmente os aspectos essenciais e acrescentar detalhes conforme o nível de análise.", "Acoplamento máximo, garantindo dependência entre todos os componentes.", "Implementação imediata, eliminando a necessidade de decisões arquiteturais.", "Manutenção corretiva, pois modifica defeitos existentes no código.", "Validação operacional, pois substitui a necessidade de testes."], "c": 0, "e": "A alternativa correta é A: Abstração, permitindo representar inicialmente os aspectos essenciais e acrescentar detalhes conforme o nível de análise."}, {"topic": "Arquitetura de Software", "q": "Uma plataforma de comércio eletrônico foi organi- zada em três partes principais: interface com o usuário, regras de negócio e acesso aos dados. Essa decisão arquitetural busca estabelecer res- ponsabilidades distintas para os componentes do sistema. A principal vantagem dessa organização é:", "a": ["Garantir que o sistema nunca apresentará defeitos.", "Eliminar integralmente a necessidade de comunicação entre os componentes.", "Favorecer a separação de responsabilidades, a manutenção e a evolução do software.", "Impedir que qualquer alteração seja realizada após a implantação.", "Substituir os requisitos funcionais por decisões de infraestrutura."], "c": 2, "e": "A alternativa correta é C: Favorecer a separação de responsabilidades, a manutenção e a evolução do software."}, {"topic": "Implementação e Arquitetura", "q": "Durante a implementação de um sistema, um de- senvolvedor decidiu modificar diretamente uma fun- cionalidade sem consultar as decisões arquiteturais previamente estabelecidas. A alteração funcionou isoladamente, mas provocou incompatibilidades com outros componentes. O problema apresentado demonstra que:", "a": ["A implementação deve ocorrer independentemente do projeto para aumentar a produtividade.", "A arquitetura somente possui importância após a implantação.", "O funcionamento isolado de um componente comprova sua integração adequada ao sistema.", "O projeto de software é desnecessário quando os desenvolvedores possuem experiência.", "A implementação deve considerar as decisões de projeto e as interfaces entre componentes, preservando a coerência da solução."], "c": 4, "e": "A alternativa correta é E: A implementação deve considerar as decisões de projeto e as interfaces entre componentes, preservando a coerência da solução."}, {"topic": "Testes de Software", "q": "Um sistema de vendas estabelece a seguinte regra: pedidos superiores a R 250,00 apresentou cobrança de R$ 20,00 pelo frete. Considerando o objetivo dos testes de software, é correto afirmar que:", "a": ["O teste foi bem-sucedido porque o sistema executou a operação sem interromper o processamento.", "Foi identificada uma divergência entre o comportamento esperado e o comportamento observado, indicando uma falha no atendimento à regra especificada.", "O resultado demonstra exclusivamente um problema de desempenho.", "A cobrança do frete comprova que a regra de negócio foi implementada corretamente.", "A execução do sistema elimina a necessidade de comparar os resultados com os requisitos."], "c": 1, "e": "A alternativa correta é B: Foi identificada uma divergência entre o comportamento esperado e o comportamento observado, indicando uma falha no atendimento à regra especificada."}, {"topic": "Níveis de Teste", "q": "Uma equipe realizou testes em funções individuais de cálculo de impostos. Posteriormente, verificou a comunicação entre os módulos de faturamento e pagamento. Por fim, avaliou o comportamento com- pleto da aplicação. As atividades descritas correspondem, respectiva- mente, aos níveis de teste:", "a": ["Aceitação, regressão e manutenção.", "Sistema, aceitação e unidade.", "Integração, sistema e unidade.", "Unidade, integração e sistema.", "Regressão, integração e implantação. 200, 00devemreceberfretegratuito.Duranteumteste, u"], "c": 3, "e": "A alternativa correta é D: Unidade, integração e sistema."}, {"topic": "Teste de Regressão", "q": "Após corrigir um defeito no cálculo de descontos, uma equipe verificou que funcionalidades anterior- mente aprovadas passaram a apresentar resulta- dos incorretos. Para identificar efeitos indesejados provocados pela alteração, a equipe deverá priorizar:", "a": ["Testes de regressão, verificando se funcionalidades existentes continuam apresentando o comportamento esperado.", "Exclusivamente testes de instalação, sem executar funcionalidades já existentes.", "Testes de usabilidade restritos à aparência visual da aplicação.", "Apenas revisão da documentação de requisitos, dispensando execução do software.", "Substituição completa da aplicação, independentemente da extensão do defeito."], "c": 0, "e": "A alternativa correta é A: Testes de regressão, verificando se funcionalidades existentes continuam apresentando o comportamento esperado."}, {"topic": "Manutenção de Software", "q": "Uma empresa realizou três intervenções em seu sistema: I. Corrigiu uma falha que impedia a emissão de no- tas fiscais. II. Atualizou componentes para manter a compatibi- lidade com uma nova versão do sistema operacio- nal. III. Acrescentou uma funcionalidade de acompanha- mento de entregas solicitada pelos clientes. Considerando as categorias de manutenção de software, as intervenções I, II e III correspondem, respectivamente, a:", "a": ["Preventiva, corretiva e adaptativa.", "Evolutiva, preventiva e corretiva.", "Corretiva, adaptativa e evolutiva.", "Adaptativa, evolutiva e preventiva.", "Corretiva, evolutiva e adaptativa."], "c": 2, "e": "A alternativa correta é C: Corretiva, adaptativa e evolutiva."}, {"topic": "Tipos de Manutenção", "q": "Um sistema hospitalar apresenta código excessiva- mente complexo em determinado módulo. Embora nenhuma falha tenha sido identificada, a equipe de- cidiu reorganizar sua estrutura interna para reduzir a probabilidade de problemas futuros e facilitar in- tervenções posteriores. Essa atividade caracteriza predominantemente:", "a": ["Manutenção corretiva, porque corrige obrigatoriamente uma falha observada pelo usuário.", "Manutenção adaptativa, porque altera o sistema para um novo ambiente operacional.", "Manutenção evolutiva, porque acrescenta uma funcionalidade solicitada pelo cliente.", "Teste de aceitação, porque verifica o atendimento aos requisitos dos usuários.", "Manutenção preventiva, porque busca reduzir riscos futuros e melhorar a capacidade de manutenção do software."], "c": 4, "e": "A alternativa correta é E: Manutenção preventiva, porque busca reduzir riscos futuros e melhorar a capacidade de manutenção do software."}, {"topic": "Modelo Cascata", "q": "Uma organização pretende desenvolver um sis- tema cujos requisitos estão amplamente definidos, com necessidade de documentação formal, aprova- ção de entregáveis e acompanhamento de fases previamente planejadas. Entre as abordagens estudadas, o modelo Cascata pode ser considerado adequado quando:", "a": ["O projeto exige mudanças constantes sem avaliação de impacto.", "Há estabilidade relativa dos requisitos e condições favoráveis ao planejamento antecipado e à organização predominantemente sequencial das atividades.", "A organização pretende eliminar completamente a documentação.", "As funcionalidades devem obrigatoriamente ser redefinidas a cada dia.", "A equipe não possui condições de realizar levantamento de requisitos."], "c": 1, "e": "A alternativa correta é B: Há estabilidade relativa dos requisitos e condições favoráveis ao planejamento antecipado e à organização predominantemente sequencial das atividades."}, {"topic": "Desenvolvimento Incremental e Iterativo", "q": "Uma equipe desenvolveu inicialmente uma versão de um sistema acadêmico com autenticação e ca- dastro de estudantes. Na versão seguinte, acres- centou matrícula online. Posteriormente, incorporou consulta de notas e emissão de histórico. Paralelamente, aprimorou funcionalidades já exis- tentes com base no retorno dos usuários. Nesse cenário, é correto afirmar que:", "a": ["A equipe utiliza exclusivamente desenvolvimento sequencial, pois as funcionalidades são entregues em versões.", "A inclusão de novas funcionalidades representa iteração, enquanto o refinamento das existentes representa incremento.", "O desenvolvimento incremental impede a realização de revisões em funcionalidades anteriores.", "A adição de funcionalidades caracteriza incrementos, enquanto o refinamento sucessivo das soluções caracteriza iterações.", "Iteração e incremento são conceitos incompatíveis e não podem ocorrer no mesmo projeto."], "c": 3, "e": "A alternativa correta é D: A adição de funcionalidades caracteriza incrementos, enquanto o refinamento sucessivo das soluções caracteriza iterações."}, {"topic": "Processo Unificado", "q": "Uma organização adotou o Processo Unificado para desenvolver uma plataforma de gestão empre- sarial. Durante a fase de Elaboração, a equipe con- centrou esforços na definição da arquitetura e na redução de riscos técnicos relevantes. Considerando as características do Processo Unifi- cado, assinale a alternativa correta.", "a": ["O Processo Unificado é iterativo e incremental, orientado a casos de uso, centrado na arquitetura e direcionado à mitigação de riscos.", "O Processo Unificado estabelece que todos os requisitos devem permanecer imutáveis durante todo o projeto.", "A fase de Elaboração corresponde exclusivamente à codificação completa do sistema.", "As fases de Concepção, Elaboração, Construção e Transição impedem a realização de atividades de testes em diferentes momentos.", "O Processo Unificado dispensa decisões arquiteturais porque prioriza exclusivamente a entrega de funcionalidades."], "c": 0, "e": "A alternativa correta é A: O Processo Unificado é iterativo e incremental, orientado a casos de uso, centrado na arquitetura e direcionado à mitigação de riscos."}, {"topic": "Scrum", "q": "Uma equipe de desenvolvimento adotou Scrum para construir uma plataforma de serviços digitais. Durante uma Sprint, os desenvolvedores identifica- ram dificuldades técnicas que ameaçavam o al- cance do objetivo estabelecido. Considerando as responsabilidades definidas pelo Scrum, assinale a alternativa correta.", "a": ["O Scrum Master deve assumir a chefia técnica e distribuir individualmente todas as tarefas da equipe.", "O Product Owner deve executar obrigatoriamente todas as atividades de programação.", "Os Developers são responsáveis por planejar e adaptar seu trabalho para produzir um incremento utilizável que atenda à Definition of Done, buscando alcançar o Sprint Goal.", "A Daily Scrum deve ser utilizada exclusivamente para apresentar relatórios de produtividade à direção da empresa.", "O Sprint Backlog deve permanecer inalterado mesmo quando os desenvolvedores identificarem a necessidade de adaptar o plano."], "c": 2, "e": "A alternativa correta é C: Os Developers são responsáveis por planejar e adaptar seu trabalho para produzir um incremento utilizável que atenda à Definition of Done, buscando alcançar o Sprint Goal."}, {"topic": "Kanban", "q": "Uma empresa mantém uma plataforma digital que recebe continuamente solicitações de correção, pe- quenas melhorias e novas funcionalidades. A equipe enfrenta dificuldades para visualizar o traba- lho em andamento e identificar gargalos. A direção deseja melhorar o fluxo de atendimento sem necessariamente organizar todas as atividades em Sprints de duração fixa. Considerando as abordagens estudadas, a alterna- tiva mais adequada é:", "a": ["Adotar obrigatoriamente o Cascata, pois ele elimina a necessidade de priorização contínua.", "Utilizar exclusivamente TDD, pois testes automatizados substituem a gestão do fluxo de trabalho.", "Adotar Scrum e eliminar seus eventos para garantir fluxo contínuo.", "Abandonar qualquer forma de planejamento, pois a demanda é variável.", "Aplicar práticas de Kanban, visualizando o fluxo, limitando o trabalho em progresso e acompanhando gargalos e tempos de execução. PRÁTICA — PRESENCIAL — PROVA Versão A — Código da avaliação: ARA00970001"], "c": 4, "e": "A alternativa correta é E: Aplicar práticas de Kanban, visualizando o fluxo, limitando o trabalho em progresso e acompanhando gargalos e tempos de execução. PRÁTICA — PRESENCIAL — PROVA Versão A — Código da avaliação: ARA00970001"}];let current=0;const answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const quiz=document.getElementById('quiz'),result=document.getElementById('result'),nav=document.getElementById('nav');
function build(){quiz.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('section');el.className='card';el.id='card-'+i;el.innerHTML=`<span class="badge">${q.topic}</span><h2>${i+1}. ${q.q}</h2><div class="options">${q.a.map((a,j)=>`<label class="option" data-option="${j}"><input type="radio" name="q-${i}" value="${j}"><b>${String.fromCharCode(65+j)})</b> ${a}</label>`).join('')}</div><div class="feedback" id="feedback-${i}"></div><div class="actions"><button class="check" id="check-${i}">✓ Verificar resposta</button><button class="next" id="next-${i}" disabled>${i===questions.length-1?'Ver resultado':'Próxima questão →'}</button></div>`;quiz.appendChild(el);el.querySelectorAll('.option').forEach(label=>label.addEventListener('click',()=>{if(checked[i])return;el.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected');label.querySelector('input').checked=true;answers[i]=Number(label.dataset.option)}));el.querySelector('.check').addEventListener('click',()=>checkAnswer(i));el.querySelector('.next').addEventListener('click',()=>goNext(i))});nav.innerHTML='';questions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=`Ir para questão ${i+1}`;b.id='nav-'+i;b.addEventListener('click',()=>showQuestion(i));nav.appendChild(b)});showQuestion(0)}
function score(){return checked.reduce((n,v,i)=>n+(v&&answers[i]===questions[i].c?1:0),0)}
function updateHeader(){document.getElementById('progressText').textContent=`Questão ${current+1} de ${questions.length}`;document.getElementById('scoreText').textContent=`Acertos: ${score()}`;document.getElementById('progressBar').style.width=(checked.filter(Boolean).length/questions.length*100)+'%';questions.forEach((q,i)=>{const b=document.getElementById('nav-'+i);b.classList.toggle('done',checked[i]);b.classList.toggle('current',i===current)})}
function showQuestion(i){if(i<0||i>=questions.length)return;current=i;document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('active',j===current));updateHeader();window.scrollTo({top:0,behavior:'smooth'})}
function checkAnswer(i){if(checked[i])return;if(answers[i]===null){alert('Selecione uma alternativa antes de verificar.');return}const q=questions[i],card=document.getElementById('card-'+i),fb=document.getElementById('feedback-'+i);checked[i]=true;card.querySelectorAll('.option').forEach((el,j)=>{el.style.pointerEvents='none';if(j===q.c)el.classList.add('correct');if(j===answers[i]&&answers[i]!==q.c)el.classList.add('wrong')});const ok=answers[i]===q.c;fb.className='feedback show '+(ok?'ok':'bad');fb.innerHTML=(ok?'<b>✓ Correto!</b> ':'<b>✗ Incorreto.</b> Resposta correta: <b>'+String.fromCharCode(65+q.c)+') '+q.a[q.c]+'</b>. ')+q.e;document.getElementById('check-'+i).disabled=true;document.getElementById('next-'+i).disabled=false;updateHeader()}
function goNext(i){if(!checked[i])return;if(i===questions.length-1){showResult();return}showQuestion(i+1)}
function showResult(){quiz.style.display='none';result.classList.add('show');const correct=score(),pct=Math.round(correct/questions.length*100),grade=(correct/questions.length*10).toFixed(1),topics={};questions.forEach((q,i)=>{topics[q.topic]??={total:0,correct:0};topics[q.topic].total++;if(checked[i]&&answers[i]===q.c)topics[q.topic].correct++});let bars='';Object.entries(topics).forEach(([name,v])=>{bars+=`<div class="topic"><div class="topichead"><span>${name}</span><b>${v.correct}/${v.total}</b></div><div class="mini"><div style="width:${Math.round(v.correct/v.total*100)}%"></div></div></div>`});result.innerHTML=`<h2>Resultado final</h2><div class="score">${grade}/10</div><b>${pct>=90?'Excelente desempenho!':pct>=70?'Bom desempenho.':pct>=50?'Resultado intermediário: revise os temas com menor aproveitamento.':'Recomenda-se revisar os conteúdos e tentar novamente.'}</b><div class="stats"><div class="stat"><b>${correct}</b>Acertos</div><div class="stat"><b>${questions.length-correct}</b>Erros ou não respondidas</div><div class="stat"><b>${pct}%</b>Aproveitamento</div></div><h3>Desempenho por tema</h3>${bars}<p class="hint">Questões extraídas do arquivo fornecido. A correção destaca a alternativa indicada como correta e resume seu conteúdo.</p><button class="secondary" id="restart">↻ Refazer simulado</button>`;document.getElementById('restart').addEventListener('click',restart);window.scrollTo({top:0,behavior:'smooth'})}
function restart(){current=0;answers.fill(null);checked.fill(false);result.classList.remove('show');result.innerHTML='';quiz.style.display='block';build()}build();
</script></body></html>
